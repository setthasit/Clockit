apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/PROJECT_ID/clockit/api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: api-env
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel:4318
            - name: OTEL_SERVICE_NAME
              value: clockit-api
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
