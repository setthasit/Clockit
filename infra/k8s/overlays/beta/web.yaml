apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/PROJECT_ID/clockit/web:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: clockit-web-beta
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
