apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
replicas:
  - name: api
    count: 2
# Standalone NEG (plan task 6.2 fallback) instead of Gateway/HTTPRoute: one ALB must
# serve both the web bucket and the API, and a GKE Gateway provisions its own LB.
# The NEG is attached to a google_compute_backend_service in stack 50-edge.
patches:
  # One ALB, but two host rules — the SPA at clockit.setthasit.dev calls
  # api.clockit.setthasit.dev, so the browser treats it as cross-origin and preflights.
  # Same host deploy-web.yml builds the prod bundle's VITE_API_URL against.
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: CORS_ORIGINS
                    value: https://clockit.setthasit.dev
  # Without this the HPA's minReplicas of 1 undoes `replicas: 2` on the first reconcile.
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
  - target:
      kind: Service
      name: api
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: api
        annotations:
          cloud.google.com/neg: '{"exposed_ports":{"80":{"name":"clockit-api-prod"}}}'
