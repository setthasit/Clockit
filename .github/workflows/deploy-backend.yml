# Repo variables:  vars.GCP_PROJECT_ID, vars.GCP_WIF_PROVIDER, vars.GCP_SERVICE_ACCOUNT,
#                  vars.GKE_CLUSTER
# Repo secrets:    none
# Environments:    prod (approval gate on the tag promotion)
#
# Beta deploys on main; a v* tag PROMOTES that same image to prod and never rebuilds.
name: deploy-backend

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/clockit
  # Placeholder image names as written in infra/k8s; kustomize rewrites them by name.
  API_PLACEHOLDER: us-central1-docker.pkg.dev/PROJECT_ID/clockit/api
  WEB_PLACEHOLDER: us-central1-docker.pkg.dev/PROJECT_ID/clockit/web

jobs:
  # `paths:` on a push trigger would also filter tag pushes, so the path filter lives here.
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'backend/**'
              - 'infra/k8s/**'

  beta:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: build and push api image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$REGISTRY/api:$GITHUB_SHA" backend
          docker push "$REGISTRY/api:$GITHUB_SHA"

      - run: gcloud container clusters get-credentials "${{ vars.GKE_CLUSTER }}" --region us-central1

      - name: apply beta overlay
        shell: bash
        run: |
          cd infra/k8s/overlays/beta
          # The overlay also carries the beta web Deployment, so its image needs a real
          # project too. Keep whatever sha web last deployed instead of moving it.
          # ponytail: on a first-ever beta bring-up web has no live image and lands on
          # :latest until deploy-web runs; drop this once web leaves the api overlay.
          WEB=$(kubectl -n beta get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          kustomize edit set image "$API_PLACEHOLDER=$REGISTRY/api:$GITHUB_SHA"
          kustomize edit set image "$WEB_PLACEHOLDER=${WEB:-$REGISTRY/web:latest}"
          kubectl apply -k .
          kubectl -n beta rollout status deployment/api --timeout=5m

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      # On a tag push GITHUB_SHA is the tagged commit, so this is the beta-tested image.
      - name: require the beta-tested image to exist
        run: gcloud artifacts docker images describe "$REGISTRY/api:$GITHUB_SHA"

      - run: gcloud container clusters get-credentials "${{ vars.GKE_CLUSTER }}" --region us-central1

      - name: apply prod overlay
        run: |
          cd infra/k8s/overlays/prod
          kustomize edit set image "$API_PLACEHOLDER=$REGISTRY/api:$GITHUB_SHA"
          kubectl apply -k .
          kubectl -n prod rollout status deployment/api --timeout=5m
